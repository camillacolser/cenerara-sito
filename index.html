<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Cenerara – Velleia, Lugagnano Val d'Arda</title>
  <meta name="description" content="Cascina La Cenerara, Velleia – Lugagnano Val d'Arda (Piacenza). Informazioni e prenotazioni: info@lacenerara.com.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <!-- Video di sfondo da Vimeo (modalità background: senza audio, senza controlli, in loop).
         Sotto resta la foto assets/sfondo.jpg, che si vede finché il video non parte. -->
    <div class="bg-video" aria-hidden="true">
      <iframe src="https://player.vimeo.com/video/183855865?background=1&amp;autoplay=1&amp;loop=1&amp;muted=1&amp;dnt=1"
              title="La Cenerara" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" tabindex="-1"></iframe>
    </div>
    <div class="card">
      <!-- Logo: quando c'è il file, sostituire il titolo con
           <img class="logo" src="logo.png" alt="La Cenerara"> -->
      <h1 class="title">La Cenerara</h1>

      <h2>Per informazioni e prenotazioni</h2>
      <p class="email"><a href="mailto:info@lacenerara.com">info@lacenerara.com</a></p>

      <p class="links">
        <a class="btn" href="https://www.airbnb.com/rooms/1041703" target="_blank" rel="noopener">Airbnb</a>
        <a class="btn" href="https://www.instagram.com/la_cenerara" target="_blank" rel="noopener">Instagram</a>
      </p>

      <h2>Indirizzo</h2>
      <address>
        Cascina La Cenerara, Velleia<br>
        29018 Lugagnano Val d'Arda, Piacenza
      </address>
      <p><a class="btn" href="https://maps.app.goo.gl/HJCrTfA7KNiNPcdK6" target="_blank" rel="noopener">Come arrivare</a></p>
    </div>
  </main>
  <!-- Il video si mostra solo quando parte davvero: se Vimeo non si carica resta la foto. -->
  <script src="https://cdn.jsdelivr.net/npm/@vimeo/player@2.20.1/dist/player.min.js"></script>
  <script>
    (function () {
      var box = document.querySelector('.bg-video');
      if (!box || !window.Vimeo) return;
      var player = new Vimeo.Player(box.querySelector('iframe'));
      player.on('play', function () { box.classList.add('is-playing'); });
    })();
  </script>
</body>
</html>
